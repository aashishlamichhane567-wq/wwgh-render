name: brain-voice
on:
  push:
    branches: [claude/brain-voice-audition]
    paths: [brain/**, .github/workflows/brain-voice.yml]
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: { voice: [A, B, C] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Qwen3-TTS (CPU torch) and faster-whisper
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sox
          pip install -q --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q --no-cache-dir qwen-tts==0.1.1 faster-whisper soundfile
      - name: Voice ${{ matrix.voice }}
        run: python brain/audition.py ${{ matrix.voice }}
      - uses: actions/upload-artifact@v4
        with: { name: "voice-${{ matrix.voice }}", path: out/, retention-days: 14 }
