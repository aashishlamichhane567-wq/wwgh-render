# Typecheck, then render still compositions (thumbnails, channel art) to PNG.
# gh workflow run stills.yml --ref <branch> -f comps="ChannelBanner ChannelAvatarA ChannelAvatarB"
name: stills
on:
  workflow_dispatch:
    inputs:
      comps: { description: space-separated composition ids, default: "ChannelBanner ChannelAvatarA ChannelAvatarB" }

jobs:
  stills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
          npm ci --no-audit --no-fund && npx tsc --noEmit -p . && npx remotion browser ensure
          for c in ${{ inputs.comps }}; do npx remotion still $c out/$c.png --image-format=png; done
      - uses: actions/upload-artifact@v4
        with: { name: stills, path: out/*.png, retention-days: 7 }
