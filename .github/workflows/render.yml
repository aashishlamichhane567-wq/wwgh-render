# Blender shots (CPU Cycles, in parallel) -> Remotion render -> voice chain, -16 LUFS / -1.5 dBTP, standard-range yuv420p.
# gh workflow run render.yml                      (whole video, fresh Blender shots)
# gh workflow run render.yml -f blender=false     (skip Blender; drawn fallbacks show)
# gh workflow run render.yml -f frames=0-1808     (quick slice)
name: render
on:
  workflow_dispatch:
    inputs:
      frames:
        description: frame range for a quick test (blank = whole video)
        default: ""
      blender:
        description: render the Blender shots first
        default: "true"
jobs:
  blender:
    if: inputs.blender == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        shot: [enzyme, brain]
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.5 LTS and its libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxxf86vm1 libxfixes3
          curl -sSL https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz | tar -xJ
          ./blender-4.5.14-linux-x64/blender --version | head -1
      - name: Render ${{ matrix.shot }}
        run: ./blender-4.5.14-linux-x64/blender -b --factory-startup -P blender/shots.py -- ${{ matrix.shot }} out/3d/${{ matrix.shot }} 2>&1 | grep -vE "strokes set empty|Fra:" | tail -20
      - name: Frames to mp4
        run: |
          mkdir -p public/3d
          ffmpeg -hide_banner -loglevel error -framerate 30 -i out/3d/${{ matrix.shot }}/%04d.png -c:v libx264 -crf 16 -pix_fmt yuv420p public/3d/${{ matrix.shot }}.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 public/3d/${{ matrix.shot }}.mp4
      - uses: actions/upload-artifact@v4
        with: { name: "3d-${{ matrix.shot }}", path: "public/3d/${{ matrix.shot }}.mp4", retention-days: 7 }

  render:
    needs: blender
    if: always() && (needs.blender.result == 'success' || needs.blender.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.blender == 'true'
        with: { pattern: "3d-*", path: public/3d, merge-multiple: true }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - name: Fonts, ffmpeg and Chrome libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 \
            libpango-1.0-0 libatk-bridge2.0-0
          ls -la public/3d public/real || true
      - name: Render
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure
          npx remotion render Wwgh out/raw.mp4 --concurrency=100% --pixel-format=yuv420p --jpeg-quality=95 ${{ inputs.frames && format('--frames={0}', inputs.frames) || '' }}
      - name: Voice chain, loudness -16 LUFS / -1.5 dBTP, final encode
        run: |
          ffmpeg -hide_banner -loglevel error -i out/raw.mp4 -vf "scale=in_range=full:out_range=tv,format=yuv420p" -c:v libx264 -preset medium -tune animation -crf 18 \
            -colorspace bt709 -color_primaries bt709 -color_trc bt709 -color_range tv \
            -af "$(cat voice_chain.txt),loudnorm=I=-16:TP=-1.5:LRA=11" -c:a aac -b:a 320k -movflags +faststart out/Wwgh.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 out/Wwgh.mp4
      - uses: actions/upload-artifact@v4
        with: { name: Wwgh, path: out/Wwgh.mp4, retention-days: 7 }
